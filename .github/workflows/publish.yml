name: Publish Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # create the GitHub release
  id-token: write  # Open VSX trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package -o "zenc-$GITHUB_REF_NAME.vsix"

      # The VS Code Marketplace upload is manual: the .vsix is taken from this release.
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "zenc-$GITHUB_REF_NAME.vsix" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to Open VSX
        run: npx ovsx publish --packagePath "zenc-$GITHUB_REF_NAME.vsix" --trusted-publishing --skip-duplicate
